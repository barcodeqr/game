<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D防衛ゲーム</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: #fff;
            font-size: 16px; font-weight: bold; text-shadow: 1px 1px 3px #000;
            pointer-events: none;
        }
        #game-over {
            display: none; position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; background: rgba(0,0,0,0.85);
            color: #ff3333; flex-direction: column; justify-content: center;
            align-items: center; cursor: pointer;
        }
    </style>

    <!-- Three.js 外部ライブラリの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="ui">
        <div id="score-text">SCORE: 0</div>
        <div id="weapon-text">WEAPON: 鉄砲 (威力:1)</div>
        <div id="cannons-text">CANNONS: 1 / 4 (MAX)</div>
        <div id="hp-text" style="color:#2ecc71;">HP: 100 / 100</div>
    </div>
    <div id="game-over">
        <h1 style="font-size: 40px; margin: 0;">GAME OVER</h1>
        <p style="color:#fff; font-size:18px;">防衛線が突破された！</p>
        <p id="final-score" style="color:#fff; font-size:18px;">Final Score: 0</p>
        <p style="color:#aaa; font-size:14px; margin-top:20px;">画面をタップ/クリックで再挑戦</p>
    </div>

<script>
// --- 基本セットアップ ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec0ee); // 爽やかな青空

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 35, 25);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// --- ライティング ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
scene.add(dirLight);

// --- テクスチャ生成ヘルパー ---
function createRealisticGrassTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#4c8c2b';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 20000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const radius = Math.random() * 2 + 1;
        ctx.fillStyle = Math.random() > 0.5 ? '#3d7320' : '#5da835';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(20, 20);
    return texture;
}

function createRealisticDirtTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#6b4423';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 25000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const radius = Math.random() * 2.5;
        ctx.fillStyle = Math.random() > 0.5 ? '#53331a' : '#85542d';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(2, 10);
    return texture;
}

// --- フィールド & 3つのレーン ---
const fieldLength = 32;
const laneWidth = 5;
const laneCenterPositions = [-5.5, 0, 5.5]; // 0:左, 1:中央, 2:右

const outerGroundGeo = new THREE.PlaneGeometry(200, 200);
const outerGroundMat = new THREE.MeshStandardMaterial({ map: createRealisticGrassTexture(), roughness: 0.9 });
const outerGround = new THREE.Mesh(outerGroundGeo, outerGroundMat);
outerGround.rotation.x = -Math.PI / 2;
outerGround.position.y = -0.05;
outerGround.receiveShadow = true;
scene.add(outerGround);

laneCenterPositions.forEach(x => {
    const floorGeo = new THREE.PlaneGeometry(laneWidth, fieldLength);
    const floorMat = new THREE.MeshStandardMaterial({ map: createRealisticDirtTexture(), roughness: 0.95 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.x = x;
    floor.receiveShadow = true;
    scene.add(floor);
});

laneCenterPositions.forEach(x => {
    [-laneWidth/2, laneWidth/2].forEach(offset => {
        for (let z = -14; z <= 12; z += 8) {
            const stoneGeo = new THREE.DodecahedronGeometry(0.4);
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.8 });
            const stone = new THREE.Mesh(stoneGeo, stoneMat);
            stone.position.set(x + offset, 0.2, z);
            stone.castShadow = true;
            scene.add(stone);
        }
    });
});

laneCenterPositions.forEach(x => {
    const lineGeo = new THREE.BoxGeometry(laneWidth, 0.15, 0.3);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
    const defenseLine = new THREE.Mesh(lineGeo, lineMat);
    defenseLine.position.set(x, 0.08, 12);
    scene.add(defenseLine);
});

// --- ゲーム変数 ---
let isGameOver = false;
let score = 0;
let frame = 0;

let nextCenterSpawnTimer = 80;
let nextRightSpawnTimer = 500;
let nextLeftSpawnTimer = 400;

let player = {
    laneIndex: 1,      
    subPosition: 1,    
    x: 0,
    z: 13,             
    hp: 100,
    maxHp: 100,
    cannons: 1,        // MAX 4
    fireRate: 15,      
    weaponType: 'gun'  // 'gun' (鉄砲), 'cannon' (大砲), 'laser' (レーザー)
};

let playerGroup = new THREE.Group();
scene.add(playerGroup);

let bullets = [];
let enemies = [];
let gates = [];

// --- テクスチャ・文字用描画ヘルパー ---
function createTextSprite(text, fontSize = 90, textColor = "#ffff00", strokeColor = "#000000") {
    const canvas = document.createElement('canvas');
    canvas.width = 512; 
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    
    ctx.clearRect(0, 0, 512, 256);
    ctx.font = `900 ${fontSize}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (strokeColor) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 16;
        ctx.strokeText(text, 256, 128);
    }

    ctx.fillStyle = textColor;
    ctx.fillText(text, 256, 128);

    const texture = new THREE.CanvasTexture(canvas);
    return { canvas, texture };
}

// 武器に応じた見た目の砲台生成
function createWeaponMesh(weaponType) {
    const group = new THREE.Group();

    if (weaponType === 'gun') {
        const bodyGeo = new THREE.CylinderGeometry(0.12, 0.15, 1.2, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.8 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.rotation.x = -Math.PI / 3;
        body.position.y = 0.5;
        body.castShadow = true;
        group.add(body);
    } else if (weaponType === 'cannon') {
        const bodyGeo = new THREE.CylinderGeometry(0.3, 0.4, 1.5, 12);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.rotation.x = -Math.PI / 3;
        body.position.y = 0.6;
        body.castShadow = true;
        group.add(body);
    } else if (weaponType === 'laser') {
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x9b59b6, emissive: 0x8e44ad, metalness: 0.9 });
        [-0.2, 0.2].forEach(ox => {
            const barrelGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.6, 8);
            const barrel = new THREE.Mesh(barrelGeo, bodyMat);
            barrel.rotation.x = -Math.PI / 3;
            barrel.position.set(ox, 0.6, 0);
            group.add(barrel);
        });
    }

    const baseGeo = new THREE.BoxGeometry(1, 0.4, 1.2);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = 0.2;
    base.castShadow = true;
    group.add(base);

    return group;
}

function updatePlayercannons() {
    while(playerGroup.children.length > 0){ 
        playerGroup.remove(playerGroup.children[0]); 
    }
    const spacing = 1.1;
    const startX = -((player.cannons - 1) * spacing) / 2;
    for (let i = 0; i < player.cannons; i++) {
        const cannon = createWeaponMesh(player.weaponType);
        cannon.position.set(startX + i * spacing, 0, 0);
        playerGroup.add(cannon);
    }
}

function updatePlayerPosition() {
    const baseLaneX = laneCenterPositions[player.laneIndex];
    const subOffsets = [-1.4, 0, 1.4];
    player.x = baseLaneX + subOffsets[player.subPosition];
    playerGroup.position.x = player.x;
    playerGroup.position.z = player.z;
}

// 3D人型生成
function createHumanMesh(scale, color, hp = 1) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: color });

    const headGeo = new THREE.SphereGeometry(0.4 * scale, 12, 12);
    const head = new THREE.Mesh(headGeo, mat);
    head.position.y = 1.4 * scale;
    head.castShadow = true;
    group.add(head);

    const bodyGeo = new THREE.BoxGeometry(0.6 * scale, 0.8 * scale, 0.4 * scale);
    const body = new THREE.Mesh(bodyGeo, mat);
    body.position.y = 0.8 * scale;
    body.castShadow = true;
    group.add(body);

    const legGeo = new THREE.BoxGeometry(0.2 * scale, 0.6 * scale, 0.2 * scale);
    const legL = new THREE.Mesh(legGeo, mat);
    legL.position.set(-0.15 * scale, 0.3 * scale, 0);
    legL.castShadow = true;
    group.add(legL);

    const legR = legL.clone();
    legR.position.x = 0.15 * scale;
    group.add(legR);

    let hpSpriteObj = null;
    if (scale > 1.2) {
        hpSpriteObj = createTextSprite(`HP:${hp}`, 100, "#ffea00", "#000000");
        const textMat = new THREE.MeshBasicMaterial({ map: hpSpriteObj.texture, transparent: true, side: THREE.DoubleSide });
        const textGeo = new THREE.PlaneGeometry(5, 2.5);
        const hpMesh = new THREE.Mesh(textGeo, textMat);
        hpMesh.position.set(0, 2.2 * scale, 0);
        group.add(hpMesh);
    }

    return { mesh: group, hpSpriteObj: hpSpriteObj };
}

function updateEnemyHpText(enemy) {
    if (!enemy.hpSpriteObj) return;
    const ctx = enemy.hpSpriteObj.canvas.getContext('2d');
    ctx.clearRect(0, 0, 512, 256);
    ctx.font = "900 100px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 16;
    ctx.strokeText(`HP:${enemy.hp}`, 256, 128);

    ctx.fillStyle = "#ffea00";
    ctx.fillText(`HP:${enemy.hp}`, 256, 128);
    enemy.hpSpriteObj.texture.needsUpdate = true;
}

// --- ゲートの生成 ---
function createGateMesh(hp, type, label) {
    const group = new THREE.Group();

    let dummyWeapon = 'gun';
    if (type === 'cannon') dummyWeapon = 'cannon';
    if (type === 'laser') dummyWeapon = 'laser';
    if (type === 'plus') dummyWeapon = player.weaponType;

    const model = createWeaponMesh(dummyWeapon);
    model.scale.set(2.2, 2.2, 2.2);
    model.position.y = 0.2;
    group.add(model);

    const labelText = `${label}\n[${hp}]`;
    const textColor = type === 'laser' ? "#9b59b6" : (type === 'cannon' ? "#e67e22" : "#00ffff");

    const textSprite = createTextSprite(labelText, 80, textColor, "#000000");
    const textMat = new THREE.MeshBasicMaterial({ map: textSprite.texture, transparent: true });
    const textGeo = new THREE.PlaneGeometry(5.8, 2.8);
    const textMesh = new THREE.Mesh(textGeo, textMat);
    textMesh.position.set(0, 2.8, 0);
    group.add(textMesh);

    return { mesh: group, textSprite: textSprite };
}

function updateGateText(gate) {
    const ctx = gate.textSprite.canvas.getContext('2d');
    ctx.clearRect(0, 0, 512, 256);
    ctx.font = "900 80px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const labelText = `${gate.label} [${gate.hp}]`;
    const textColor = gate.type === 'laser' ? "#9b59b6" : (gate.type === 'cannon' ? "#e67e22" : "#00ffff");

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 16;
    ctx.strokeText(labelText, 256, 128);
    ctx.fillStyle = textColor;
    ctx.fillText(labelText, 256, 128);
    
    gate.textSprite.texture.needsUpdate = true;
}

// --- 操作処理 ---
function handleInput(clientX) {
    if (isGameOver) return;
    const xRatio = clientX / window.innerWidth;

    if (xRatio < 0.11) { player.laneIndex = 0; player.subPosition = 0; }
    else if (xRatio < 0.22) { player.laneIndex = 0; player.subPosition = 1; }
    else if (xRatio < 0.33) { player.laneIndex = 0; player.subPosition = 2; }
    else if (xRatio < 0.44) { player.laneIndex = 1; player.subPosition = 0; }
    else if (xRatio < 0.55) { player.laneIndex = 1; player.subPosition = 1; }
    else if (xRatio < 0.66) { player.laneIndex = 1; player.subPosition = 2; }
    else if (xRatio < 0.77) { player.laneIndex = 2; player.subPosition = 0; }
    else if (xRatio < 0.88) { player.laneIndex = 2; player.subPosition = 1; }
    else { player.laneIndex = 2; player.subPosition = 2; }

    updatePlayerPosition();
}

window.addEventListener('pointermove', (e) => handleInput(e.clientX));
window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) handleInput(e.touches[0].clientX);
}, { passive: true });

// --- スポーン関数 ---
function spawnGate() {
    const hp = 15 + Math.floor(score / 3);
    const laneIdx = 0;
    const x = laneCenterPositions[laneIdx];
    
    const rand = Math.random();
    let type, label;
    if (player.weaponType === 'gun') {
        type = 'cannon'; label = '大砲へ変更';
    } else if (player.weaponType === 'cannon' && rand < 0.5) {
        type = 'laser'; label = 'レーザーへ変更';
    } else {
        type = 'plus'; label = '大砲+1';
    }

    const gateObj = createGateMesh(hp, type, label);
    gateObj.mesh.position.set(x, 0, -15);
    scene.add(gateObj.mesh);

    gates.push({
        hp: hp,
        type: type,
        label: label,
        meshData: gateObj,
        textSprite: gateObj.textSprite,
        z: -15,
        x: x
    });
}

function spawnEnemyFormation() {
    const laneIdx = 1;
    const baseLaneX = laneCenterPositions[laneIdx];
    const offsets = [-1.4, 0, 1.4];

    let totalRows = score < 100 ? Math.floor(Math.random() * 4) + 2 : Math.floor(Math.random() * 12) + 4;
    const rowSpacing = 1.3;

    for (let r = 0; r < totalRows; r++) {
        const startZ = -15 - (r * rowSpacing);
        offsets.forEach(offsetX => {
            const posX = baseLaneX + offsetX;
            const enemyObj = createHumanMesh(0.65, 0xe67e22); 
            enemyObj.mesh.position.set(posX, 0, startZ);
            scene.add(enemyObj.mesh);

            enemies.push({
                mesh: enemyObj.mesh,
                x: posX,
                z: startZ,
                type: 'normal',
                hp: 1,
                speed: 0.08,
                hitWidth: 0.7, 
                hitDepth: 0.7
            });
        });
    }
}

function spawnGiantHumanEnemy() {
    const hp = 20 + Math.floor(score / 2);
    const laneIdx = 2;
    const x = laneCenterPositions[laneIdx];
    const enemyObj = createHumanMesh(2.0, 0xc0392b, hp);
    enemyObj.mesh.position.set(x, 0, -15);
    scene.add(enemyObj.mesh);

    enemies.push({
        mesh: enemyObj.mesh,
        hpSpriteObj: enemyObj.hpSpriteObj,
        x: x,
        z: -15,
        type: 'giant',
        hp: hp,
        speed: 0.04,
        hitWidth: 1.5,
        hitDepth: 0.8
    });
}

function restartGame() {
    isGameOver = false;
    score = 0;
    frame = 0;
    nextCenterSpawnTimer = 80;
    nextRightSpawnTimer = 500;
    nextLeftSpawnTimer = 400;
    player.hp = 100;
    player.cannons = 1;
    player.weaponType = 'gun';
    player.laneIndex = 1;
    player.subPosition = 1;
    updatePlayerPosition();

    bullets.forEach(b => scene.remove(b.mesh));
    enemies.forEach(e => scene.remove(e.mesh));
    gates.forEach(g => scene.remove(g.meshData.mesh));
    bullets = []; enemies = []; gates = [];

    updateUI();
    updatePlayercannons();
    document.getElementById('game-over').style.display = 'none';
}

function updateUI() {
    document.getElementById('score-text').innerText = "SCORE: " + score;
    
    let weaponName = "鉄砲 (威力:1)";
    if (player.weaponType === 'cannon') weaponName = "大砲 (威力:2)";
    if (player.weaponType === 'laser') weaponName = "レーザー (威力:3)";
    document.getElementById('weapon-text').innerText = "WEAPON: " + weaponName;
    
    document.getElementById('cannons-text').innerText = "CANNONS: " + player.cannons + " / 4 (MAX)";
    const hpText = document.getElementById('hp-text');
    hpText.innerText = "HP: " + player.hp + " / " + player.maxHp;
    hpText.style.color = player.hp > 30 ? "#2ecc71" : "#e74c3c";
}

// 初期化
updatePlayerPosition();
updatePlayercannons();

// --- メインループ ---
function animate() {
    requestAnimationFrame(animate);

    if (isGameOver) {
        renderer.render(scene, camera);
        return;
    }

    frame++;

    if (frame % player.fireRate === 0) {
        const spacing = 1.1;
        const startX = player.x - ((player.cannons - 1) * spacing) / 2;
        for (let i = 0; i < player.cannons; i++) {
            const bX = startX + i * spacing;
            const bZ = player.z - 0.8;
            let bMesh, bulletData;

            if (player.weaponType === 'laser') {
                const laserGeo = new THREE.BoxGeometry(0.1, 0.1, 1.2);
                const laserMat = new THREE.MeshBasicMaterial({ color: 0x9b59b6 });
                bMesh = new THREE.Mesh(laserGeo, laserMat);
                bMesh.position.set(bX, 0.6, bZ);
                scene.add(bMesh);
                bulletData = { mesh: bMesh, x: bX, z: bZ, damage: 3, type: 'laser' };
            } else if (player.weaponType === 'cannon') {
                const bulletGeo = new THREE.SphereGeometry(0.25, 8, 8);
                const bulletMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                bMesh = new THREE.Mesh(bulletGeo, bulletMat);
                bMesh.position.set(bX, 0.6, bZ);
                scene.add(bMesh);
                bulletData = { mesh: bMesh, x: bX, z: bZ, damage: 2, type: 'cannon' };
            } else {
                const bulletGeo = new THREE.SphereGeometry(0.12, 8, 8);
                const bulletMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
                bMesh = new THREE.Mesh(bulletGeo, bulletMat);
                bMesh.position.set(bX, 0.6, bZ);
                scene.add(bMesh);
                bulletData = { mesh: bMesh, x: bX, z: bZ, damage: 1, type: 'gun' };
            }

            bullets.push(bulletData);
        }
    }

    nextCenterSpawnTimer--;
    if (nextCenterSpawnTimer <= 0) {
        spawnEnemyFormation();
        nextCenterSpawnTimer = Math.floor(Math.random() * 50) + (score < 100 ? 120 : 70); 
    }

    nextRightSpawnTimer--;
    if (nextRightSpawnTimer <= 0) {
        spawnGiantHumanEnemy();
        nextRightSpawnTimer = Math.floor(Math.random() * 250) + 300;
    }

    nextLeftSpawnTimer--;
    if (nextLeftSpawnTimer <= 0) {
        spawnGate();
        nextLeftSpawnTimer = Math.floor(Math.random() * 300) + 300;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.z -= (b.type === 'laser' ? 0.8 : 0.5);
        b.mesh.position.z = b.z;

        if (b.z < -35) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
        }
    }

    for (let gi = gates.length - 1; gi >= 0; gi--) {
        const g = gates[gi];
        g.z += 0.05;
        g.meshData.mesh.position.z = g.z;

        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            const b = bullets[bi];
            if (Math.abs(b.x - g.x) < 2.5 && Math.abs(b.z - g.z) < 1.0) {
                g.hp -= b.damage;
                scene.remove(b.mesh);
                bullets.splice(bi, 1);
                updateGateText(g);

                if (g.hp <= 0) {
                    if (g.type === 'cannon') {
                        player.weaponType = 'cannon';
                        updatePlayercannons();
                    } else if (g.type === 'laser') {
                        player.weaponType = 'laser';
                        updatePlayercannons();
                    } else if (g.type === 'plus') {
                        if (player.cannons < 4) player.cannons++;
                        updatePlayercannons();
                    }
                    scene.remove(g.meshData.mesh);
                    gates.splice(gi, 1);
                    updateUI();
                    break;
                }
            }
        }

        if (g && g.z > player.z) {
            scene.remove(g.meshData.mesh);
            gates.splice(gi, 1);
        }
    }

    for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        e.z += e.speed;
        e.mesh.position.z = e.z;

        let enemyDestroyed = false;

        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            const b = bullets[bi];

            if (Math.abs(b.x - e.x) < e.hitWidth && Math.abs(b.z - e.z) < e.hitDepth) {
                e.hp -= b.damage;
                scene.remove(b.mesh);
                bullets.splice(bi, 1);

                if (e.type !== 'normal') {
                    updateEnemyHpText(e);
                }

                if (e.hp <= 0) {
                    score += e.type === 'normal' ? 1 : 15;
                    scene.remove(e.mesh);
                    enemies.splice(ei, 1);
                    updateUI();
                    enemyDestroyed = true;
                    break;
                }
            }
        }

        if (enemyDestroyed) continue;

        if (e.z > 12) {
            player.hp -= e.hp;
            scene.remove(e.mesh);
            enemies.splice(ei, 1);
            updateUI();

            if (player.hp <= 0) {
                player.hp = 0;
                isGameOver = true;
                document.getElementById('final-score').innerText = "Final Score: " + score;
                document.getElementById('game-over').style.display = 'flex';
            }
        }
    }

    renderer.render(scene, camera);
}

document.getElementById('game-over').addEventListener('click', restartGame);

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
