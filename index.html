<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戦車ミサイル防衛</title>
    <!-- アイコンの設定 -->
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; user-select: none; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: #fff;
            font-size: 16px; font-weight: bold; text-shadow: 1px 1px 3px #000;
            pointer-events: none;
        }
        #game-over {
            display: none; position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; background: rgba(0,0,0,0.85);
            color: #ff3333; flex-direction: column; justify-content: center;
            align-items: center; cursor: pointer;
        }
        #ranking-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #555;
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 15px;
            max-height: 220px;
            overflow-y: auto;
            text-align: left;
            width: 300px;
        }
        #ranking-box h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #ffea00;
            text-align: center;
        }
        .ranking-item {
            color: #fff;
            font-size: 14px;
            margin: 3px 0;
            display: flex;
            justify-content: space-between;
        }
    </style>

    <!-- Three.js 外部ライブラリの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="ui">
        <div id="score-text">SCORE: 0</div>
        <div id="weapon-text">WEAPON: 鉄砲 (威力:1)</div>
        <div id="rapid-text">速射レベル: 1 / 8</div>
        <div id="pierce-text">貫通力: 1 / 4</div>
        <div id="cannons-text">武器台数: 1 / 4 (MAX)</div>
        <div id="hp-text" style="color:#2ecc71; font-size: 20px; margin-top: 6px; white-space: nowrap;">HP: 125 / 125</div>
    </div>
    <div id="game-over">
        <h1 style="font-size: 36px; margin: 0;">GAME OVER</h1>
        <p style="color:#fff; font-size:16px; margin: 5px 0;">防衛線が突破された！</p>
        <p id="final-score" style="color:#ffea00; font-size:18px; margin: 5px 0;">Final Score: 0</p>
        
        <div id="ranking-box">
            <h3>- ランク (上位10位) -</h3>
            <div id="ranking-list"></div>
        </div>

        <p style="color:#aaa; font-size:13px; margin-top:15px;">画面をタップ/クリックで再挑戦</p>
    </div>

<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec0ee);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 35, 25);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
scene.add(dirLight);

function createRealisticGrassTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#4c8c2b';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 20000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const radius = Math.random() * 2 + 1;
        ctx.fillStyle = Math.random() > 0.5 ? '#3d7320' : '#5da835';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(20, 20);
    return texture;
}

function createRealisticDirtTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#6b4423';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 25000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const radius = Math.random() * 2.5;
        ctx.fillStyle = Math.random() > 0.5 ? '#53331a' : '#85542d';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(2, 10);
    return texture;
}

const fieldLength = 32;
const laneWidth = 5;
const laneCenterPositions = [-5.5, 0, 5.5];

const outerGroundGeo = new THREE.PlaneGeometry(200, 200);
const outerGroundMat = new THREE.MeshStandardMaterial({ map: createRealisticGrassTexture(), roughness: 0.9 });
const outerGround = new THREE.Mesh(outerGroundGeo, outerGroundMat);
outerGround.rotation.x = -Math.PI / 2;
outerGround.position.y = -0.05;
outerGround.receiveShadow = true;
scene.add(outerGround);

laneCenterPositions.forEach(x => {
    const floorGeo = new THREE.PlaneGeometry(laneWidth, fieldLength);
    const floorMat = new THREE.MeshStandardMaterial({ map: createRealisticDirtTexture(), roughness: 0.95 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.x = x;
    floor.receiveShadow = true;
    scene.add(floor);
});

laneCenterPositions.forEach(x => {
    [-laneWidth/2, laneWidth/2].forEach(offset => {
        for (let z = -14; z <= 12; z += 8) {
            const stoneGeo = new THREE.DodecahedronGeometry(0.4);
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.8 });
            const stone = new THREE.Mesh(stoneGeo, stoneMat);
            stone.position.set(x + offset, 0.2, z);
            stone.castShadow = true;
            scene.add(stone);
        }
    });
});

laneCenterPositions.forEach(x => {
    const lineGeo = new THREE.BoxGeometry(laneWidth, 0.15, 0.3);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
    const defenseLine = new THREE.Mesh(lineGeo, lineMat);
    defenseLine.position.set(x, 0.08, 12);
    scene.add(defenseLine);
});

let isGameOver = false;
let score = 0;
let frame = 0;

let nextCenterSpawnTimer = 150;
let nextRightSpawnTimer = 600;
let nextLeftSpawnTimer = 500;

let player = {
    targetX: 0,
    x: 0,
    z: 13,
    hp: 125,
    maxHp: 125,
    cannons: 1,
    rapidLevel: 1,
    pierceLevel: 1,
    weaponType: 'gun'
};

let playerGroup = new THREE.Group();
scene.add(playerGroup);

let bullets = [];
let enemies = [];
let gates = [];

function createTextSprite(text, fontSize = 75, textColor = "#ffff00", strokeColor = "#000000") {
    const canvas = document.createElement('canvas');
    canvas.width = 512; 
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    
    ctx.clearRect(0, 0, 512, 256);
    ctx.font = `900 ${fontSize}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (strokeColor) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 14;
        ctx.strokeText(text, 256, 128);
    }

    ctx.fillStyle = textColor;
    ctx.fillText(text, 256, 128);

    const texture = new THREE.CanvasTexture(canvas);
    return { canvas, texture };
}

function createWeaponMesh(weaponType) {
    const group = new THREE.Group();
    const tankColor = 0x4a5320;

    const hullGeo = new THREE.BoxGeometry(0.9, 0.3, 1.1);
    const hullMat = new THREE.MeshStandardMaterial({ color: tankColor, roughness: 0.7 });
    const hull = new THREE.Mesh(hullGeo, hullMat);
    hull.position.y = 0.15;
    hull.castShadow = true;
    group.add(hull);

    const trackGeo = new THREE.BoxGeometry(0.2, 0.28, 1.15);
    const trackMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
    [-0.45, 0.45].forEach(ox => {
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.position.set(ox, 0.14, 0);
        track.castShadow = true;
        group.add(track);
    });

    const turretGeo = new THREE.BoxGeometry(0.5, 0.25, 0.6);
    const turretMat = new THREE.MeshStandardMaterial({ color: tankColor, roughness: 0.6 });
    const turret = new THREE.Mesh(turretGeo, turretMat);
    turret.position.set(0, 0.42, 0.05);
    turret.castShadow = true;
    group.add(turret);

    if (weaponType === 'gun') {
        const barrelGeo = new THREE.CylinderGeometry(0.06, 0.07, 1.0, 8);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.rotation.x = -Math.PI / 2;
        barrel.position.set(0, 0.45, -0.5);
        barrel.castShadow = true;
        group.add(barrel);
    } else if (weaponType === 'cannon') {
        const barrelGeo = new THREE.CylinderGeometry(0.12, 0.14, 1.2, 12);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, metalness: 0.5, roughness: 0.4 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.rotation.x = -Math.PI / 2;
        barrel.position.set(0, 0.45, -0.6);
        barrel.castShadow = true;
        group.add(barrel);
    } else if (weaponType === 'laser') {
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x9b59b6, emissive: 0x8e44ad, metalness: 0.9 });
        [-0.12, 0.12].forEach(ox => {
            const barrelGeo = new THREE.CylinderGeometry(0.07, 0.07, 1.3, 8);
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = -Math.PI / 2;
            barrel.position.set(ox, 0.45, -0.6);
            group.add(barrel);
        });
    } else if (weaponType === 'missile') {
        const boxGeo = new THREE.BoxGeometry(0.5, 0.25, 0.8);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x7a2e2e, roughness: 0.5 });
        const launcherBox = new THREE.Mesh(boxGeo, boxMat);
        launcherBox.position.set(0, 0.55, -0.1);
        launcherBox.castShadow = true;
        group.add(launcherBox);
    }

    return group;
}

function updatePlayercannons() {
    while(playerGroup.children.length > 0){ 
        playerGroup.remove(playerGroup.children[0]); 
    }
    const spacing = 1.1;
    const startX = -((player.cannons - 1) * spacing) / 2;
    for (let i = 0; i < player.cannons; i++) {
        const cannon = createWeaponMesh(player.weaponType);
        cannon.position.set(startX + i * spacing, 0, 0);
        playerGroup.add(cannon);
    }
}

function createZombieColor() {
    const zombieColors = [0x4a6b41, 0x556b2f, 0x3b5323, 0x5c6f68, 0x4f4f4f];
    return zombieColors[Math.floor(Math.random() * zombieColors.length)];
}

function createHumanMesh(scale, colorOverride, hp = 1) {
    const group = new THREE.Group();
    const color = colorOverride !== null ? colorOverride : createZombieColor();
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 });

    const headGeo = new THREE.SphereGeometry(0.4 * scale, 12, 12);
    const head = new THREE.Mesh(headGeo, mat);
    head.position.y = 1.4 * scale;
    head.castShadow = true;
    group.add(head);

    const bodyGeo = new THREE.BoxGeometry(0.6 * scale, 0.8 * scale, 0.4 * scale);
    const body = new THREE.Mesh(bodyGeo, mat);
    body.position.y = 0.8 * scale;
    body.castShadow = true;
    group.add(body);

    const legGeo = new THREE.BoxGeometry(0.2 * scale, 0.6 * scale, 0.2 * scale);
    const legL = new THREE.Mesh(legGeo, mat);
    legL.position.set(-0.15 * scale, 0.3 * scale, 0);
    legL.castShadow = true;
    group.add(legL);

    const legR = legL.clone();
    legR.position.x = 0.15 * scale;
    group.add(legR);

    let hpSpriteObj = null;
    if (scale > 1.2) {
        hpSpriteObj = createTextSprite(`HP:${hp}`, 75, "#ffea00", "#000000");
        const textMat = new THREE.MeshBasicMaterial({ map: hpSpriteObj.texture, transparent: true, side: THREE.DoubleSide });
        const textGeo = new THREE.PlaneGeometry(5, 2.5);
        const hpMesh = new THREE.Mesh(textGeo, textMat);
        hpMesh.position.set(0, 2.2 * scale, 0);
        group.add(hpMesh);
    }

    return { mesh: group, hpSpriteObj: hpSpriteObj };
}

function updateEnemyHpText(enemy) {
    if (!enemy.hpSpriteObj) return;
    const ctx = enemy.hpSpriteObj.canvas.getContext('2d');
    ctx.clearRect(0, 0, 512, 256);
    ctx.font = "900 75px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 14;
    ctx.strokeText(`HP:${enemy.hp}`, 256, 128);

    ctx.fillStyle = "#ffea00";
    ctx.fillText(`HP:${enemy.hp}`, 256, 128);
    enemy.hpSpriteObj.texture.needsUpdate = true;
}

function getGateLabelPrefix(type) {
    if (type === 'rapid') return '速射';
    if (type === 'pierce') return '貫通';
    if (type === 'plus') return '武器';
    if (type === 'cannon') return '大砲';
    if (type === 'laser') return 'レーザー';
    if (type === 'missile') return 'ミサイル';
    return '耐久';
}

function createHeartMesh() {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, emissive: 0xc0392b, roughness: 0.3 });
    
    const sphereGeo = new THREE.SphereGeometry(0.35, 8, 8);
    const lSphere = new THREE.Mesh(sphereGeo, mat);
    lSphere.position.set(-0.2, 0.25, 0);
    group.add(lSphere);

    const rSphere = new THREE.Mesh(sphereGeo, mat);
    rSphere.position.set(0.2, 0.25, 0);
    group.add(rSphere);

    const coneGeo = new THREE.ConeGeometry(0.5, 0.9, 8);
    const cone = new THREE.Mesh(coneGeo, mat);
    cone.rotation.x = Math.PI;
    cone.position.set(0, -0.2, 0);
    group.add(cone);

    group.scale.set(0.85, 0.85, 0.85);
    return group;
}

function createGateMesh(hp, type, label) {
    const group = new THREE.Group();

    if (type === 'heart') {
        const heartGroup = createHeartMesh();
        group.add(heartGroup);
        return { mesh: group, type: type };
    }

    if (type === 'plus') {
        const model1 = createWeaponMesh(player.weaponType);
        model1.scale.set(1.0, 1.0, 1.0);
        model1.position.set(-0.4, 0.1, 0);
        model1.rotation.y = Math.PI / 2;
        group.add(model1);

        const model2 = createWeaponMesh(player.weaponType);
        model2.scale.set(1.0, 1.0, 1.0);
        model2.position.set(0.4, 0.1, 0.3);
        model2.rotation.y = Math.PI / 2;
        group.add(model2);
    } else {
        let dummyWeapon = 'gun';
        if (type === 'cannon') dummyWeapon = 'cannon';
        if (type === 'laser') dummyWeapon = 'laser';
        if (type === 'missile') dummyWeapon = 'missile';
        if (type === 'rapid' || type === 'pierce') dummyWeapon = 'gun';

        const model = createWeaponMesh(dummyWeapon);
        model.scale.set(1.2, 1.2, 1.2);
        model.position.y = 0.1;
        model.rotation.y = Math.PI / 2;
        group.add(model);
    }

    const prefix = getGateLabelPrefix(type);
    const labelText = `${prefix}: ${hp}`;
    
    let textColor = "#00ffff";
    if (type === 'laser') textColor = "#da70d6"; 
    else if (type === 'cannon') textColor = "#ffaa00"; 
    else if (type === 'missile') textColor = "#ff4444"; 
    else if (type === 'rapid') textColor = "#00ffff";
    else if (type === 'pierce') textColor = "#3498db";
    else if (type === 'plus') textColor = "#2ecc71";

    const textSprite = createTextSprite(labelText, 75, textColor, "#000000");
    const textMat = new THREE.MeshBasicMaterial({ map: textSprite.texture, transparent: true });
    const textGeo = new THREE.PlaneGeometry(5.0, 2.5);
    const textMesh = new THREE.Mesh(textGeo, textMat);
    textMesh.position.set(0, 2.2, 0);
    group.add(textMesh);

    return { mesh: group, textSprite: textSprite, type: type };
}

function updateGateText(gate) {
    if (gate.type === 'heart') return;
    const ctx = gate.textSprite.canvas.getContext('2d');
    ctx.clearRect(0, 0, 512, 256);
    ctx.font = "900 75px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const prefix = getGateLabelPrefix(gate.type);
    const labelText = `${prefix}: ${gate.hp}`;
    
    let textColor = "#00ffff";
    if (gate.type === 'laser') textColor = "#da70d6";
    else if (gate.type === 'cannon') textColor = "#ffaa00";
    else if (gate.type === 'missile') textColor = "#ff4444";
    else if (gate.type === 'rapid') textColor = "#00ffff";
    else if (gate.type === 'pierce') textColor = "#3498db";
    else if (gate.type === 'plus') textColor = "#2ecc71";

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 14;
    ctx.strokeText(labelText, 256, 128);
    ctx.fillStyle = textColor;
    ctx.fillText(labelText, 256, 128);
    
    gate.textSprite.texture.needsUpdate = true;
}

function handleInput(clientX) {
    if (isGameOver) return;
    const xRatio = clientX / window.innerWidth;

    let targetLaneIndex = 1;
    let subPosition = 1;

    if (xRatio < 0.33) { targetLaneIndex = 0; }
    else if (xRatio < 0.66) { targetLaneIndex = 1; }
    else { targetLaneIndex = 2; }

    const subRatio = (xRatio % 0.33) / 0.33;
    if (subRatio < 0.33) { subPosition = 0; }
    else if (subRatio < 0.66) { subPosition = 1; }
    else { subPosition = 2; }

    const baseLaneX = laneCenterPositions[targetLaneIndex];
    const subOffsets = [-1.4, 0, 1.4];
    player.targetX = baseLaneX + subOffsets[subPosition];
}

window.addEventListener('pointermove', (e) => handleInput(e.clientX));
window.addEventListener('pointerdown', (e) => handleInput(e.clientX));

function spawnGate() {
    const laneIdx = 0;
    const x = laneCenterPositions[laneIdx];
    
    const rand = Math.random();
    let type, label, hp;

    let heartChance = player.hp <= 30 ? 0.5 : 0.2;

    if (rand < heartChance) {
        type = 'heart';
        hp = 1;
        label = '';
    } else {
        let upgradeChance = (score < 150) ? 0.65 : 0.35;

        if (player.cannons < 4) {
            if (player.rapidLevel < 8 && Math.random() < upgradeChance) {
                type = 'rapid'; label = '速射';
                hp = player.cannons === 1 ? Math.min(3, Math.max(2, 2 + Math.floor(score / 100))) : (15 + Math.floor(score / 5));
            } else if (player.pierceLevel < 4 && Math.random() < 0.5) {
                type = 'pierce'; label = '貫通';
                hp = 15 + Math.floor(score / 5);
            } else {
                type = 'plus'; label = '武器';
                hp = 15 + Math.floor(score / 5);
            }
        } else {
            if (player.weaponType === 'gun') {
                type = 'cannon'; label = '大砲';
                hp = 15 + Math.floor(score / 5);
            } else if (player.weaponType === 'cannon' && rand < 0.35) {
                type = 'laser'; label = 'レーザー';
                hp = 20 + Math.floor(score / 5);
            } else if (player.weaponType === 'laser' && rand < 0.5) {
                type = 'missile'; label = 'ミサイル';
                hp = 25 + Math.floor(score / 5);
            } else if (player.pierceLevel < 4 && rand < 0.7) {
                type = 'pierce'; label = '貫通';
                hp = 15 + Math.floor(score / 5);
            } else if (player.rapidLevel < 8 && rand < 0.85) {
                type = 'rapid'; label = '速射';
                hp = 15 + Math.floor(score / 5);
            } else {
                type = 'plus'; label = '武器';
                hp = 15 + Math.floor(score / 5);
            }
        }
    }

    const gateObj = createGateMesh(hp, type, label);
    gateObj.mesh.position.set(x, 0, -15);
    scene.add(gateObj.mesh);

    gates.push({
        hp: hp,
        type: type,
        label: label,
        meshData: gateObj,
        textSprite: gateObj.textSprite,
        z: -15,
        x: x
    });
}

function spawnEnemyFormation() {
    const laneIdx = 1;
    const baseLaneX = laneCenterPositions[laneIdx];
    const offsets = [-1.4, 0, 1.4];

    let totalRows;
    if (score <= 300) {
        totalRows = Math.floor(Math.random() * 2) + 1; 
    } else if (score <= 600) {
        totalRows = Math.floor(Math.random() * 3) + 2; 
    } else if (score <= 1000) {
        totalRows = Math.floor(Math.random() * 5) + 3; 
    } else {
        totalRows = Math.floor(Math.random() * 8) + 5; 
    }

    const rowSpacing = 1.3;

    for (let r = 0; r < totalRows; r++) {
        const startZ = -15 - (r * rowSpacing);
        offsets.forEach(offsetX => {
            const posX = baseLaneX + offsetX;
            const enemyObj = createHumanMesh(0.65, null);
            enemyObj.mesh.position.set(posX, 0, startZ);
            scene.add(enemyObj.mesh);

            enemies.push({
                mesh: enemyObj.mesh,
                x: posX,
                z: startZ,
                type: 'normal',
                hp: 1,
                speed: 0.07,
                hitWidth: 0.7, 
                hitDepth: 0.7
            });
        });
    }
}

function spawnGiantHumanEnemy() {
    const hp = 15 + Math.floor(score / 3);
    const laneIdx = 2;
    const x = laneCenterPositions[laneIdx];
    const enemyObj = createHumanMesh(2.0, 0x3d4e38, hp);
    enemyObj.mesh.position.set(x, 0, -15);
    scene.add(enemyObj.mesh);

    enemies.push({
        mesh: enemyObj.mesh,
        hpSpriteObj: enemyObj.hpSpriteObj,
        x: x,
        z: -15,
        type: 'giant',
        hp: hp,
        speed: 0.035,
        hitWidth: 1.5,
        hitDepth: 0.8
    });
}

function handleGameOver() {
    isGameOver = true;
    document.getElementById('final-score').innerText = "Final Score: " + score;

    const now = new Date();
    const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}/${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

    let ranking = [];
    try {
        const saved = localStorage.getItem('tank_defense_ranking');
        if (saved) ranking = JSON.parse(saved);
    } catch (e) {
        ranking = [];
    }

    ranking.push({ score: score, date: dateStr });
    ranking.sort((a, b) => b.score - a.score);

    if (ranking.length > 10) {
        ranking = ranking.slice(0, 10);
    }

    try {
        localStorage.setItem('tank_defense_ranking', JSON.stringify(ranking));
    } catch (e) {}

    const listEl = document.getElementById('ranking-list');
    listEl.innerHTML = '';
    ranking.forEach((item, index) => {
        const rankDiv = document.createElement('div');
        rankDiv.className = 'ranking-item';
        rankDiv.innerHTML = `<span>${index + 1}位 ${item.score}点</span><span>${item.date}</span>`;
        listEl.appendChild(rankDiv);
    });

    document.getElementById('game-over').style.display = 'flex';
}

function restartGame() {
    isGameOver = false;
    score = 0;
    frame = 0;
    nextCenterSpawnTimer = 150;
    nextRightSpawnTimer = 600;
    nextLeftSpawnTimer = 500;
    player.hp = 125;
    player.cannons = 1;
    player.rapidLevel = 1;
    player.pierceLevel = 1;
    player.weaponType = 'gun';
    player.targetX = 0;
    player.x = 0;

    bullets.forEach(b => scene.remove(b.mesh));
    enemies.forEach(e => scene.remove(e.mesh));
    gates.forEach(g => scene.remove(g.meshData.mesh));
    bullets = []; enemies = []; gates = [];

    updateUI();
    updatePlayercannons();
    document.getElementById('game-over').style.display = 'none';
}

function updateUI() {
    document.getElementById('score-text').innerText = "SCORE: " + score;
    
    let weaponName = "鉄砲 (威力:1)";
    if (player.weaponType === 'cannon') weaponName = "大砲 (威力:2)";
    if (player.weaponType === 'laser') weaponName = "レーザー (威力:3)";
    if (player.weaponType === 'missile') weaponName = "ミサイル (威力:8)";
    document.getElementById('weapon-text').innerText = "WEAPON: " + weaponName;
    
    document.getElementById('rapid-text').innerText = "速射レベル: " + player.rapidLevel + " / 8";
    document.getElementById('pierce-text').innerText = "貫通力: " + player.pierceLevel + " / 4";
    document.getElementById('cannons-text').innerText = "武器台数: " + player.cannons + " / 4 (MAX)";
    
    const hpText = document.getElementById('hp-text');
    hpText.innerText = "HP: " + player.hp + " / " + player.maxHp;
    hpText.style.color = player.hp > 30 ? "#2ecc71" : "#e74c3c";
}

player.x = 0;
player.targetX = 0;
playerGroup.position.x = player.x;
playerGroup.position.z = player.z;
updatePlayercannons();

function animate() {
    requestAnimationFrame(animate);

    if (isGameOver) {
        renderer.render(scene, camera);
        return;
    }

    frame++;

    player.x += (player.targetX - player.x) * 0.2;
    playerGroup.position.x = player.x;
    playerGroup.position.z = player.z;

    const fireInterval = Math.max(6, 22 - (player.rapidLevel * 2));
    if (frame % fireInterval === 0) {
        const spacing = 1.1;
        const startX = player.x - ((player.cannons - 1) * spacing) / 2;
        for (let i = 0; i < player.cannons; i++) {
            const bX = startX + i * spacing;
            const bZ = player.z - 0.8;
            let bMesh, bulletData;

            if (player.weaponType === 'missile') {
                const missileGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.8, 8);
                const missileMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, metalness: 0.5 });
                bMesh = new THREE.Mesh(missileGeo, missileMat);
                bMesh.rotation.x = Math.PI / 2;
                bMesh.position.set(bX, 0.6, bZ);
                scene.add(bMesh);
                bulletData = { mesh: bMesh, x: bX, z: bZ, damage: 8, pierce: player.pierceLevel, type: 'missile' };
            } else if (player.weaponType === 'laser') {
                const laserGeo = new THREE.BoxGeometry(0.12, 0.12, 1.2);
                const laserMat = new THREE.MeshBasicMaterial({ color: 0xd4ac0d });
                bMesh = new THREE.Mesh(laserGeo, laserMat);
                bMesh.position.set(bX, 0.6, bZ);
                scene.add(bMesh);
                bulletData = { mesh: bMesh, x: bX, z: bZ, damage: 3, pierce: player.pierceLevel, type: 'laser' };
            } else if (player.weaponType === 'cannon') {
                const bulletGeo = new THREE.SphereGeometry(0.25, 8, 8);
                const bulletMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                bMesh = new THREE.Mesh(bulletGeo, bulletMat);
                bMesh.position.set(bX, 0.6, bZ);
                scene.add(bMesh);
                bulletData = { mesh: bMesh, x: bX, z: bZ, damage: 2, pierce: player.pierceLevel, type: 'cannon' };
            } else {
                const bulletGeo = new THREE.SphereGeometry(0.12, 8, 8);
                const bulletMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
                bMesh = new THREE.Mesh(bulletGeo, bulletMat);
                bMesh.position.set(bX, 0.6, bZ);
                scene.add(bMesh);
                bulletData = { mesh: bMesh, x: bX, z: bZ, damage: 1, pierce: player.pierceLevel, type: 'gun' };
            }

            bullets.push(bulletData);
        }
    }

    let centerSpawnInterval;
    if (score <= 300) {
        centerSpawnInterval = 180; 
    } else if (score <= 600) {
        centerSpawnInterval = 110; 
    } else if (score <= 1000) {
        centerSpawnInterval = 80;  
    } else {
        centerSpawnInterval = 50;  
    }

    nextCenterSpawnTimer--;
    if (nextCenterSpawnTimer <= 0) {
        spawnEnemyFormation();
        nextCenterSpawnTimer = centerSpawnInterval + Math.floor(Math.random() * 40); 
    }

    nextRightSpawnTimer--;
    if (nextRightSpawnTimer <= 0) {
        spawnGiantHumanEnemy();
        nextRightSpawnTimer = Math.max(200, 500 - Math.floor(score / 3));
    }

    nextLeftSpawnTimer--;
    if (nextLeftSpawnTimer <= 0) {
        spawnGate();
        nextLeftSpawnTimer = Math.floor(Math.random() * 150) + 350;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.z -= (b.type === 'laser' || b.type === 'missile' ? 0.8 : 0.5);
        b.mesh.position.z = b.z;

        if (b.z < -35) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
        }
    }

    for (let gi = gates.length - 1; gi >= 0; gi--) {
        const g = gates[gi];
        g.z += 0.05;
        g.meshData.mesh.position.z = g.z;

        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            const b = bullets[bi];
            if (Math.abs(b.x - g.x) < 2.5 && Math.abs(b.z - g.z) < 1.0) {
                g.hp -= b.damage;
                b.pierce--; // 貫通回数を消費

                updateGateText(g);

                if (g.hp <= 0) {
                    if (g.type === 'heart') {
                        player.hp = Math.min(player.maxHp, player.hp + 30);
                    } else if (g.type === 'cannon') {
                        player.weaponType = 'cannon';
                        player.cannons = 2;
                        player.pierceLevel = 1; // 武器変更時に貫通力リセット
                        updatePlayercannons();
                    } else if (g.type === 'laser') {
                        player.weaponType = 'laser';
                        player.cannons = 2;
                        player.pierceLevel = 1; // 武器変更時に貫通力リセット
                        updatePlayercannons();
                    } else if (g.type === 'missile') {
                        player.weaponType = 'missile';
                        player.cannons = 2;
                        player.pierceLevel = 1; // 武器変更時に貫通力リセット
                        updatePlayercannons();
                    } else if (g.type === 'rapid') {
                        if (player.rapidLevel < 8) player.rapidLevel++;
                    } else if (g.type === 'pierce') {
                        if (player.pierceLevel < 4) player.pierceLevel++;
                    } else if (g.type === 'plus') {
                        if (player.cannons < 4) player.cannons++;
                        updatePlayercannons();
                    }
                    scene.remove(g.meshData.mesh);
                    gates.splice(gi, 1);
                    updateUI();
                }

                // 貫通力がなくなったら弾を消滅
                if (b.pierce <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(bi, 1);
                }

                break;
            }
        }

        if (g && g.z > player.z) {
            scene.remove(g.meshData.mesh);
            gates.splice(gi, 1);
        }
    }

    for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        e.z += e.speed;
        e.mesh.position.z = e.z;

        let enemyDestroyed = false;

        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            const b = bullets[bi];

            if (Math.abs(b.x - e.x) < e.hitWidth && Math.abs(b.z - e.z) < e.hitDepth) {
                e.hp -= b.damage;
                b.pierce--; // 貫通回数を消費

                if (e.type !== 'normal') {
                    updateEnemyHpText(e);
                }

                if (e.hp <= 0) {
                    score += e.type === 'normal' ? 1 : 15;
                    scene.remove(e.mesh);
                    enemies.splice(ei, 1);
                    updateUI();
                    enemyDestroyed = true;
                }

                // 貫通力がなくなったら弾を消滅
                if (b.pierce <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(bi, 1);
                }

                break;
            }
        }

        if (enemyDestroyed) continue;

        if (e.z > 12) {
            player.hp -= e.hp;
            scene.remove(e.mesh);
            enemies.splice(ei, 1);

            if (e.type === 'giant') {
                if (player.cannons > 1) {
                    player.cannons--;
                    updatePlayercannons();
                }
            }

            updateUI();

            if (player.hp <= 0) {
                player.hp = 0;
                handleGameOver();
            }
        }
    }

    renderer.render(scene, camera);
}

document.getElementById('game-over').addEventListener('click', restartGame);

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
